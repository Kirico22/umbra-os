name: ISO de UMBRA OS (desde el zip)

# El repositorio solo necesita el zip del proyecto (umbra-os-X.Y.Z.zip) y este archivo.
# Se lanza al subir un zip nuevo (o cualquier cambio) y a mano desde «Actions».
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          ZIP=$(ls umbra-os-*.zip | sort -V | tail -1)
          echo "Proyecto: $ZIP"
          unzip -q "$ZIP" -d /tmp/umbra
          cp -a /tmp/umbra/umbra-os-*/. .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Todos los pasos están en iso/construir.sh (Debian 13 se construye dentro de Docker)
      - name: Construir la ISO
        id: iso
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash iso/construir.sh

      - name: Guardar la ISO
        uses: actions/upload-artifact@v4
        with:
          name: umbra-os-iso
          path: |
            ${{ steps.iso.outputs.name }}
            ${{ steps.iso.outputs.name }}.sha256
          retention-days: 14
          compression-level: 0

      - name: Guardar el registro de construcción
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: iso/build.log
          if-no-files-found: ignore
